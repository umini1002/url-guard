services:
  - type: web
    name: url-guard-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -X utf8 ai/train_model.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PYTHONUTF8
        value: '1'
      - key: OMP_NUM_THREADS
        value: '2'
      - key: ALLOWED_ORIGINS
        value: https://umini1002.github.io
